name: Publish

# THE FILENAME IS PART OF THE CONFIGURATION. PyPI's trusted publisher is
# registered against `publish.yml`, so renaming this file breaks publishing
# with `invalid-publisher` and nothing else explains why.
#
# The trigger is the RELEASE, not the tag. A `push: tags` would publish the
# moment a tag reaches the remote, with no human step between
# `git push --tags` and PyPI; creating a release is a deliberate act, and it
# makes the release notes and the publication the same gesture.
on:
  release:
    types: [published]

  # The escape hatch, for a release that was published before this workflow
  # existed, or one whose event did not fire. PyPI accepts it: the trusted
  # publisher registers no event, and its `event_name` check is a one-item
  # blocklist that rejects `pull_request_target` and nothing else. Read in
  # warehouse/oidc/models/github.py, where the publisher side of that claim
  # is literally a property returning "placeholder" with the comment "not
  # used".
  #
  # It needs write access to the repository, so the guard is the same one
  # that guards everything else here: the `pypi` environment has a required
  # reviewer, and that approval is the last point where this can be stopped.
  workflow_dispatch:

# Read the code and nothing else. Declaring any permission explicitly turns
# the rest off, so the two jobs that publish have to ask for their own.
permissions:
  contents: read

jobs:
  # Builds and checks. It does NOT publish, and the jobs that publish do NOT
  # build: the packaging guide asks for that split, and it buys two things.
  # The job holding the OIDC token does as little as possible, and the file
  # that reaches PyPI is the exact one that was checked here rather than a
  # rebuild of it.
  build:
    name: build the artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The rehearsal. TestPyPI is a separate instance with its own account and
  # its own publisher: nothing is inherited from PyPI. It runs first so a
  # broken circuit shows up somewhere that does not burn the version.
  testpypi:
    name: TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/galcymedia
    # The only permission trusted publishing needs, and it goes on the JOB:
    # at workflow level the build job would carry the token for no reason.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      # No username, no password, no API token: their mere presence takes
      # the action out of the trusted publishing path. GitHub proves who it
      # is to PyPI over OIDC, and the attestations that tie each file to this
      # workflow are generated by default.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # The real one, and it waits for the rehearsal. A version on PyPI cannot be
  # replaced, not even by deleting it: a bad upload means publishing 0.1.1.
  # The `pypi` environment carries a required reviewer, which is the last
  # point where this can be stopped.
  pypi:
    name: PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/galcymedia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
